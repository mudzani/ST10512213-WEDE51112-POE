<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry | Paw Haven Animal Rescue</title>
    <meta name="description" content="Enquire about adopting an animal, volunteering, or sponsoring at Paw Haven Animal Rescue.">
    <meta name="keywords" content="animal adoption enquiry, volunteer animal shelter, sponsor rescue animals, Paw Haven Johannesburg">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to main content</a>

    <!-- The shared header contains the site logo and main page navigation. -->
    <header class="site-header">
        <a class="logo-link" href="index.html" aria-label="Paw Haven home">
            <img src="images/logo.png" alt="Paw Haven Animal Rescue logo" width="165" height="160">
        </a>
        <nav aria-label="Main navigation">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="adopt.html">Adopt</a></li>
                <li><a href="enquiry.html" aria-current="page">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <!-- The main section contains the enquiry form and its status feedback. -->
    <main id="main-content">
        <section class="page-intro content-card" id="enquiry-intro">
            <h1>Adopt, Volunteer, or Sponsor</h1>
            <p>Tell us how you'd like to help, and a member of our team will be in touch.</p>
        </section>

        <!-- Enquiry form: the animal field appears when an adoption enquiry is selected. -->
        <section class="form-panel content-card" id="enquiry-form-section">
            <form id="enquiry-form" data-form="enquiry" data-recipient="donald.mudzani@gmail.com" novalidate>
                <div class="field-group">
                    <label for="enquiry-name">Full Name <span aria-hidden="true">*</span></label>
                    <input type="text" id="enquiry-name" name="name" autocomplete="name" minlength="2" maxlength="80" required aria-describedby="enquiry-name-error">
                    <span class="field-error" id="enquiry-name-error"></span>
                </div>
                <div class="field-group">
                    <label for="enquiry-email">Email Address <span aria-hidden="true">*</span></label>
                    <input type="email" id="enquiry-email" name="email" autocomplete="email" maxlength="120" required aria-describedby="enquiry-email-error">
                    <span class="field-error" id="enquiry-email-error"></span>
                </div>
                <div class="field-group">
                    <label for="enquiry-phone">Phone Number</label>
                    <input type="tel" id="enquiry-phone" name="phone" autocomplete="tel" pattern="[0-9 +()\-]{7,20}" title="Use 7 to 20 characters: digits, spaces, +, brackets or hyphens." aria-describedby="enquiry-phone-error">
                    <span class="field-error" id="enquiry-phone-error"></span>
                </div>
                <div class="field-group">
                    <label for="enquiry-type">Enquiry Type <span aria-hidden="true">*</span></label>
                    <select id="enquiry-type" name="enquiryType" required aria-describedby="enquiry-type-error">
                        <option value="">-- Please select --</option>
                        <option value="adopt">Adopt an animal</option>
                        <option value="volunteer">Volunteer</option>
                        <option value="sponsor">Sponsor an animal</option>
                        <option value="other">Other</option>
                    </select>
                    <span class="field-error" id="enquiry-type-error"></span>
                </div>
                <div class="field-group" id="animal-choice-group" hidden>
                    <label for="enquiry-animal">Which animal are you asking about? <span aria-hidden="true">*</span></label>
                    <select id="enquiry-animal" name="animal" aria-describedby="enquiry-animal-error">
                        <option value="">Choose an animal</option>
                        <option>Buddy</option>
                        <option>Whiskers</option>
                        <option>Nala</option>
                        <option>Max</option>
                    </select>
                    <span class="field-error" id="enquiry-animal-error"></span>
                </div>
                <div class="field-group">
                    <label for="enquiry-message">Message <span aria-hidden="true">*</span></label>
                    <textarea id="enquiry-message" name="message" rows="5" minlength="10" maxlength="1000" required aria-describedby="enquiry-message-error"></textarea>
                    <span class="field-error" id="enquiry-message-error"></span>
                </div>
                <button type="submit">Submit Enquiry</button>
                <p id="enquiry-status" class="form-status" role="status" aria-live="polite"></p>
            </form>
        </section>
    </main>

    <!-- The footer repeats the original project information on every page. -->
    <footer class="site-footer">
        <p>&copy; 2026 Paw Haven Animal Rescue. All rights reserved.</p>
    </footer>
</body>
</html>
